services:

  nginx:
    image: nginx:1.29-alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./api-gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./api-gateway/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - auth-service
    networks:
      - backend_net

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    expose:
      - "3000"
    env_file:
      - ./services/auth-service/.env
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - backend_net

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    expose:
      - "3001"
    env_file:
      - ./services/notification-service/.env
    volumes:
      - ./services/notification-service:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - backend_net
    
  postgres:
    image: postgres:17
    container_name: healthcare-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: healthcare_admin
      POSTGRES_PASSWORD: healthcare_dev_password
      POSTGRES_DB: healthcare
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_net

  rabbitmq:
    image: rabbitmq:4-management
    container_name: healthcare-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend_net

networks:
  backend_net:

volumes:
  postgres-data:
  rabbitmq-data: