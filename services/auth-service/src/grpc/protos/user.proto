syntax = "proto3";

package user;

// User service RPC methods
service UserService {
  rpc GetUser (GetUserRequest)
      returns (GetUserResponse);
  rpc GetInvitedHospitalIds (GetInvitedHospitalIdsRequest)
      returns (GetInvitedHospitalIdsResponse);
}

// Get user
message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  string email = 4;
  string role = 6;
  string status = 7;
}

// Get invited hospital
message GetInvitedHospitalIdsRequest {}

message GetInvitedHospitalIdsResponse {
  repeated string hospital_ids = 1;
}